<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#8fd8ff" />
<title>Ada Macerası — Sayılar ve Şekiller</title>
<meta name="description" content="2. sınıf çocuklar için çarpım tablosu ve geometri macera oyunu." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='34' fill='%23ff9a3d'/%3E%3Ccircle cx='50' cy='38' r='24' fill='%23ffb15c'/%3E%3Cpolygon points='28,24 38,4 48,26' fill='%23ff9a3d'/%3E%3Cpolygon points='52,26 62,4 72,24' fill='%23ff9a3d'/%3E%3Ccircle cx='40' cy='38' r='5' fill='%2324324a'/%3E%3Ccircle cx='60' cy='38' r='5' fill='%2324324a'/%3E%3C/svg%3E">
</head>
<body data-world="w1" data-view="login">

  <div class="scene" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="hill h1"></div>
    <div class="hill h2"></div>
    <div class="sea"></div>
    <div class="ground"></div>
    <div class="sparkles" id="sparkles"></div>
  </div>

  <header class="hud" id="hud">
    <button class="hud-chip" id="hud-profile" type="button" aria-label="Oyuncu profili">
      <span class="hud-avatar" id="hud-avatar">🦊</span>
      <span class="hud-nick" id="hud-nick">Oyuncu</span>
    </button>
    <div class="hud-stats">
      <span class="hud-stat" id="hud-stars" title="Yıldızlar">★ 0</span>
      <span class="hud-stat" id="hud-coins" title="Jetonlar">● 0</span>
    </div>
    <div class="hud-tools">
      <button class="icon-btn" id="btn-sound" type="button" aria-pressed="true" title="Ses efektleri">🔊</button>
      <button class="icon-btn" id="btn-voice" type="button" aria-pressed="true" title="Sesli anlatım">🗣️</button>
      <button class="icon-btn" id="btn-music" type="button" aria-pressed="false" title="Müzik">🎵</button>
      <button class="icon-btn txt" id="btn-bigtext" type="button" aria-pressed="false" title="Büyük yazı">A+</button>
    </div>
  </header>

  <main id="screens">
    <section class="screen" data-screen="login"></section>
    <section class="screen" data-screen="map"></section>
    <section class="screen" data-screen="game"></section>
    <section class="screen" data-screen="result"></section>
    <section class="screen" data-screen="duel"></section>
    <section class="screen" data-screen="board"></section>
    <section class="screen" data-screen="parent"></section>
    <section class="screen" data-screen="shop"></section>
    <section class="screen" data-screen="album"></section>
  </main>

  <canvas id="confetti" class="confetti-layer" aria-hidden="true"></canvas>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="dialog" class="dialog-layer" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
